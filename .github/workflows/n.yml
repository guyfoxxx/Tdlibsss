name: Build TDLib (v7a + v8a) and Android App

# Ø§Ø¬Ø±Ø§: Ù‡Ù… Ø¯Ø³ØªÛŒ (workflow_dispatch) Ùˆ Ù‡Ù… Ø±ÙˆÛŒ Ù‡Ø± push Ø¨Ù‡ main
on:
  workflow_dispatch:
