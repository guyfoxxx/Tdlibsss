  #        Ø®ÙˆØ¯ Ù¾Ø±ÙˆÚ˜Ù‡â€ŒÛŒ tdlib/td (example/android)
  # ---------------------------------------------------------------
  build-tdlib:
    runs-on: ubuntu-latest
