name: Build TDLib (armeabi-v7a + arm64-v8a) - fajle for AIDE / phone build

on:
  workflow_dispatch:
    inputs:
      td_commit:
        description: "Commit/Tag از ریپوی tdlib/td (خالی = آخرین master)"
        required: false
        default: ""

permissions:
  contents: write   # لازم برای ساختن Release و آپلود zip روش

env:
  ABIS: "armeabi-v7a arm64-v8a"
  NDK_VERSION: "25.2.9519653"

jobs:
  build-tdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout tdlib/td
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ github.event.inputs.td_commit || 'master' }}
          path: td

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk-bundle \
            /opt/ghc /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build gperf php-cli git zip unzip \
            openjdk-17-jdk-headless

      - name: Cache Android SDK/NDK + OpenSSL build
        uses: actions/cache@v4
        with:
          path: |
            td/example/android/third_party
            td/example/android/build-openssl
            ~/Android/Sdk
          key: tdlib-android-${{ env.NDK_VERSION }}-${{ hashFiles('td/example/android/*.sh') }}

      - name: check-environment.sh
        working-directory: td/example/android
        run: |
          chmod +x *.sh
          ./check-environment.sh

      - name: fetch-sdk.sh
        working-directory: td/example/android
        run: ./fetch-sdk.sh

      - name: build-openssl.sh
        working-directory: td/example/android
        run: ./build-openssl.sh

      - name: build-tdlib.sh (می‌سازه برای هر ۴ ABI)
        working-directory: td/example/android
        run: ./build-tdlib.sh

      - name: Keep only armeabi-v7a + arm64-v8a
        working-directory: td/example/android/tdlib
        run: |
          echo "ABI های ساخته‌شده:"; ls libs
          for abi in $ABIS; do
            [ -d "libs/$abi" ] || { echo "!! $abi ساخته نشد"; exit 1; }
          done
          find libs -mindepth 1 -maxdepth 1 -type d | while read -r d; do
            abi=$(basename "$d")
            echo "$ABIS" | grep -qw "$abi" || rm -rf "$d"
          done
          ls -R libs

      # بسته‌بندی خروجی به یک ساختار آماده که مستقیم می‌تونی
      # کپی/پیست کنی تو پروژه‌ی اندرویدی روی گوشی (مثلاً با AIDE):
      #   jniLibs/armeabi-v7a/libtdjni.so
      #   jniLibs/arm64-v8a/libtdjni.so
      #   java/org/drinkless/...   (کلاس‌های Client و TdApi)
      - name: Package into a single zip
        working-directory: td/example/android/tdlib
        run: |
          mkdir -p /tmp/out/jniLibs /tmp/out/java
          cp -r libs/* /tmp/out/jniLibs/
          [ -d java ] && cp -r java/* /tmp/out/java/ || true
          cd /tmp/out
          zip -r tdlib-android-v7a-v8a.zip jniLibs java
          ls -la

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-v7a-v8a
          path: /tmp/out/tdlib-android-v7a-v8a.zip
          retention-days: 30

      # این بخش یه Release می‌سازه با یه لینک مستقیم دانلود؛ باز کردنش
      # تو مرورگر گوشی و گرفتن zip خیلی راحت‌تر از صفحه‌ی Actions است.
      - name: Publish as GitHub Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tdlib-${{ github.run_number }}
          name: "TDLib android libs (v7a+v8a) - run ${{ github.run_number }}"
          files: /tmp/out/tdlib-android-v7a-v8a.zip
