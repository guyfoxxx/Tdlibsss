name: Build TDLib (v7a + v8a) and Android App

# اجرا: هم دستی (workflow_dispatch) و هم روی هر push به main
on:
  workflow_dispatch:
    inputs:
      td_commit:
        description: "Commit/Tag از ریپوی tdlib/td (خالی = آخرین master)"
        required: false
        default: ""
  push:
    branches: [ main ]

env:
  # این دو تا معماری‌ای هستن که خواستی نگه داری (7=armeabi-v7a, 8=arm64-v8a)
  ABIS: "armeabi-v7a arm64-v8a"
  NDK_VERSION: "25.2.9519653"

jobs:
  # ---------------------------------------------------------------
  # JOB 1: کامپایل خود TDLib (JNI) برای دو معماری با اسکریپت‌های رسمی
  #        خود پروژه‌ی tdlib/td (example/android)
  # ---------------------------------------------------------------
  build-tdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout tdlib/td
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ github.event.inputs.td_commit || 'master' }}
          path: td

      - name: Free up disk space (SDK/NDK + OpenSSL build نیاز به فضای زیاد دارن)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk-bundle \
            /opt/ghc /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build gperf php-cli git zip unzip \
            openjdk-17-jdk-headless

      - name: Cache Android SDK/NDK + OpenSSL build
        uses: actions/cache@v4
        with:
          path: |
            td/example/android/third_party
            td/example/android/build-openssl
            ~/Android/Sdk
          key: tdlib-android-${{ env.NDK_VERSION }}-${{ hashFiles('td/example/android/*.sh') }}

      - name: check-environment.sh
        working-directory: td/example/android
        run: |
          chmod +x *.sh
          ./check-environment.sh

      - name: fetch-sdk.sh (دانلود Android SDK محلی برای بیلد)
        working-directory: td/example/android
        run: ./fetch-sdk.sh

      - name: build-openssl.sh (کامپایل OpenSSL برای اندروید)
        working-directory: td/example/android
        run: ./build-openssl.sh

      - name: build-tdlib.sh (کامپایل خود TDLib برای همه‌ی ABI ها)
        working-directory: td/example/android
        run: ./build-tdlib.sh

      # اسکریپت بالا به‌صورت پیش‌فرض هر ۴ معماری (armeabi-v7a, arm64-v8a,
      # x86, x86_64) رو می‌سازه؛ اینجا فقط همون دوتایی که لازم داری
      # (v7a و v8a) رو نگه می‌داریم تا حجم آرتیفکت/اپ کمتر بشه.
      - name: Keep only armeabi-v7a + arm64-v8a
        working-directory: td/example/android/tdlib
        run: |
          echo "ABI های ساخته‌شده:"; ls libs
          for abi in $ABIS; do
            [ -d "libs/$abi" ] || { echo "!! $abi ساخته نشد"; exit 1; }
          done
          find libs -mindepth 1 -maxdepth 1 -type d | while read -r d; do
            abi=$(basename "$d")
            echo "$ABIS" | grep -qw "$abi" || rm -rf "$d"
          done
          ls -R libs

      - name: Upload tdlib artifact (libs + java glue classes)
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-libs
          path: |
            td/example/android/tdlib/libs
            td/example/android/tdlib/java
          retention-days: 14

  # ---------------------------------------------------------------
  # JOB 2: ریختن .so های ساخته‌شده تو پروژه‌ی CigarettePriceFinder
  #        و گرفتن بیلد اندروید (APK)
  # ---------------------------------------------------------------
  build-app:
    needs: build-tdlib
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Download tdlib artifact
        uses: actions/download-artifact@v4
        with:
          name: tdlib-android-libs
          path: tdlib-out

      - name: Place .so files into jniLibs
        run: |
          for abi in $ABIS; do
            mkdir -p app/src/main/jniLibs/$abi
            cp -v tdlib-out/libs/$abi/*.so app/src/main/jniLibs/$abi/
          done
          find app/src/main/jniLibs -type f

      # کلاس‌های جاوای Client / TdApi که TDLib تولید می‌کنه رو کنار
      # کدهای پروژه می‌ذاریم (پکیج org.drinkless...). اگر ترجیح می‌دی
      # به‌صورت jar جدا زیر app/libs باشه، این استپ رو عوض کن.
      - name: Copy generated TDLib Java sources
        run: |
          mkdir -p app/src/main/java
          cp -rv tdlib-out/java/org app/src/main/java/ || true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 3.5.3 / Gradle 6.1.1 که تو پروژه‌ست با JDK 8 سازگارترـه
          java-version: "8"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper jar
        run: |
          # پروژه فعلاً gradle-wrapper.jar نداره (طبق README خودِ پروژه)،
          # پس با یک Gradle نصب‌شده روی رانر، wrapper رو می‌سازیم.
          gradle wrapper --gradle-version 6.1.1
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CigarettePriceFinder-debug-apk
          path: app/build/outputs/apk/debug/*.apk
