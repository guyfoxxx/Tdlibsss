name: Build TDLib for Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - name: Checkout TDLib source
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          submodules: recursive

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare cross-compiling (generate auto sources)
        run: |
          mkdir -p build-native
          cd build-native
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --target prepare_cross_compiling -- -j$(nproc)

      - name: Configure
        run: |
          mkdir -p build-${{ matrix.abi }}
          cd build-${{ matrix.abi }}
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=${{ matrix.abi }} \
                -DANDROID_PLATFORM=android-21 \
                -DANDROID_STL=c++_static \
                -DTD_ENABLE_JNI=ON \
                -DCMAKE_INSTALL_PREFIX:PATH=../install-${{ matrix.abi }} \
                ..

      - name: Build
        run: |
          cd build-${{ matrix.abi }}
          cmake --build . --target install -- -j$(nproc)

      - name: Collect .so file
        run: |
          mkdir -p output/${{ matrix.abi }}
          find install-${{ matrix.abi }} -iname "libtdjni.so" -exec cp {} output/${{ matrix.abi }}/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-${{ matrix.abi }}
          path: output/${{ matrix.abi }}/libtdjni.so

      - name: Upload Java sources (only once)
        if: matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-java-sources
          path: example/java/org/drinkless/tdlib/*.java
