name: Build TDLib Android ARM

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            cmake \
            ninja-build \
            gperf \
            build-essential


      - name: Clone TDLib
        run: |
          git clone --depth 1 https://github.com/tdlib/td.git
          test -f td/CMakeLists.txt


      - name: Install NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c


      - name: Configure
        run: |

          mkdir build-${{ matrix.abi }}

          cd build-${{ matrix.abi }}

          cmake ../td \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.abi }} \
          -DANDROID_PLATFORM=android-21 \
          -DANDROID_STL=c++_shared \
          -DTD_ENABLE_JNI=ON \
          -DCMAKE_CXX_FLAGS="-std=c++17"


      - name: Compile with full error
        run: |

          cd build-${{ matrix.abi }}

          ninja -v -j2 2>&1 | tee build.log

          
      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log-${{ matrix.abi }}
          path: build-${{ matrix.abi }}/build.log


      - name: Install
        run: |
          cd build-${{ matrix.abi }}
          ninja install


      - name: Collect
        run: |

          mkdir -p output/jniLibs/${{ matrix.abi }}

          find . -name "libtdjni.so" -exec cp {} output/jniLibs/${{ matrix.abi }}/ \;

          find . -name "libtdjson.so" -exec cp {} output/jniLibs/${{ matrix.abi }}/ \;


      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-${{ matrix.abi }}
          path: output/      - name: Clone TDLib
        run: |
          git clone --depth 1 https://github.com/tdlib/td.git


      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c


      - name: Configure TDLib
        run: |

          mkdir build

          cd build

          cmake ../td \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.abi }} \
          -DANDROID_PLATFORM=android-21 \
          -DANDROID_STL=c++_shared \
          -DTD_ENABLE_JNI=ON \
          -DCMAKE_CXX_FLAGS="-std=c++17" \
          -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install


      - name: Build
        run: |
          cd build
          ninja -j2


      - name: Install
        run: |
          cd build
          ninja install


      - name: Collect libraries
        run: |

          mkdir -p output/jniLibs/${{ matrix.abi }}

          cp install/lib/libtdjni.so \
          output/jniLibs/${{ matrix.abi }}/ || true

          cp install/lib/libtdjson.so \
          output/jniLibs/${{ matrix.abi }}/ || true


      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-${{ matrix.abi }}
          path: output/
